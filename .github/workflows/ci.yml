name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ubuntu quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - run: cargo xtask check

  macos:
    name: macOS host smoke
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - run: cargo test --workspace

  msrv:
    name: Rust 1.85.0 MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check --workspace --all-targets

  coverage:
    name: Line coverage 98%
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - run: cargo install cargo-llvm-cov --locked --version 0.9.0
      - run: cargo xtask coverage --minimum 98

  deterministic-performance:
    name: Generated artifact size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - run: cargo xtask perf --check
