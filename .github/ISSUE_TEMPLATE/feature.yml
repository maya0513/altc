name: Feature proposal
description: 言語・toolingの変更を評価可能な形で提案する
title: "proposal: "
body:
  - type: dropdown
    id: priority
    attributes:
      label: 分類
      options:
        - P2 — 新機能・探索
        - P1 — 正しいprogramの拒否を解消
        - P0 — silent wrongを解消
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 解決する問題
      description: 現在書けない、誤解しやすい、またはC ABIを不透明にする最小例を示してください。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 提案する構文・意味
      description: 構文だけでなくeffect、memory、C loweringへの影響も記載してください。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 代替案とtrade-off
    validations:
      required: true
  - type: textarea
    id: evaluation
    attributes:
      label: 評価方法
      description: probe、golden、repair case、benchmarkなど成功を判断できる検査を示してください。
    validations:
      required: true
